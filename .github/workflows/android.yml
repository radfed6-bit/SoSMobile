name: Android CI

on:
  push:
    branches: [ "main", "master", "v3_openjdk" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download LTW artifact (if available)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Download Mesa artifact (if available)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_mojo/libs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Create output directory
        run: mkdir -p out

      - name: Build SoSMobile Debug APK
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}"
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk "out/SoSMobile-${VERSION}.apk"

      - name: Build Debug APK (No runtime)
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}"
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk "out/SoSMobile-noruntime-${VERSION}.apk"

      - name: Generate Checksums
        run: |
          cd out
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}"
          sha256sum "SoSMobile-${VERSION}.apk" > "SoSMobile-${VERSION}.apk.sha256"
          sha256sum "SoSMobile-noruntime-${VERSION}.apk" > "SoSMobile-noruntime-${VERSION}.apk.sha256"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoSMobile-apk
          path: |
            out/SoSMobile-v*.apk
            out/SoSMobile-v*.apk.sha256

      - name: Upload Noruntime APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoSMobile-noruntime-apk
          path: |
            out/SoSMobile-noruntime-v*.apk
            out/SoSMobile-noruntime-v*.apk.sha256

      - name: Create Automatic GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: SoSMobile Development Release (${{ github.ref_name }})
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1' }}
          prerelease: true
          draft: false
          body: |
            ## SoSMobile - Songs of Syx ARM64 Android Launcher (Beta / WIP)

            > **Work in Progress Notice:**
            > SoSMobile is currently under active development. This build is a beta development build and not a final release.

            ### Build Information:
            - **Commit**: `${{ github.sha }}`
            - **Ref**: `${{ github.ref }}`
            - **Target Architecture**: ARM64 (`aarch64`)
            - **Android API**: 21+ (Target 36)
            - **Runtime**: OpenJDK 17 + LWJGL 3.4.1 + OpenGL 3.3 Core Profile

            ### Included Assets:
            - `SoSMobile-v0.1.1.apk`: Full launcher build with bundled OpenJDK 17 runtime
            - `SoSMobile-noruntime-v0.1.1.apk`: Thin launcher variant
          files: |
            out/SoSMobile-*.apk
            out/SoSMobile-*.apk.sha256
